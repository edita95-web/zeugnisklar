name = "zeugnisklar"
main = "src/worker.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
# Polar: organization ID from Polar -> Settings -> General (not secret)
POLAR_ORGANIZATION_ID = "840f64d5-f9eb-45db-a0ce-6d2d587a3d32"
# "true" while testing with sandbox.polar.sh, "false" for real sales
POLAR_SANDBOX = "false"
# Checkout links from Polar -> Products -> (product) -> Share / Checkout link
CHECKOUT_URL_SINGLE = "https://buy.polar.sh/polar_cl_Y5Y48DKRDxrWf5yZNTrT767J07XqYlfXmpVUx2asVGN"
CHECKOUT_URL_FAMILY = "https://buy.polar.sh/polar_cl_uQ9zxx2hkd1DJvlpj989NruJTgtQ9RcqxTJM92Jte5q"
# Behördenbrief tool (license key prefix BB) and expert review products
CHECKOUT_URL_BRIEF_SINGLE = ""
CHECKOUT_URL_BRIEF_PACK = ""
CHECKOUT_URL_EXPERT_ZEUGNIS = ""
CHECKOUT_URL_EXPERT_BRIEF = ""
# E-mail where customers of the expert review send their document
CONTACT_EMAIL = ""
# "off" disables the license check (only for testing!)
PAYMENTS = "polar"
# Claude model and effort. Defaults are fine.
ANTHROPIC_MODEL = "claude-opus-5-5"
ANTHROPIC_EFFORT = "medium"
# "off" turns off the automatic fallback model (only if the first real test fails)
FALLBACKS = "default"
# "true" returns the sample report without calling the AI (for testing)
MOCK_AI = "false"

# The API key is a secret. Set it with:  npx wrangler secret put ANTHROPIC_API_KEY
# or in the Cloudflare dashboard: Worker -> Settings -> Variables and Secrets.
